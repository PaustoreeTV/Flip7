<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIP 7 – Punktezähler</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #f5c542;
    --orange: #f07d2a;
    --blue: #1a3a6b;
    --blue-light: #2356a8;
    --green: #2ecc71;
    --red: #e74c3c;
    --bg: #0f2447;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: white;
    background-image:
      radial-gradient(ellipse at 20% 20%, #1e3f7a 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #0a1e40 0%, transparent 50%);
  }

  header { text-align: center; padding: 24px 16px 12px; }
  header h1 {
    font-family: 'Bangers', cursive;
    font-size: 3.2rem; letter-spacing: 4px; color: var(--gold);
    text-shadow: 3px 3px 0 var(--orange), 6px 6px 0 rgba(0,0,0,0.3);
    line-height: 1;
  }
  header p { color: #aac4f0; font-size: 0.85rem; margin-top: 4px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
  .target-badge {
    display: inline-block; background: var(--gold); color: var(--blue);
    font-family: 'Bangers', cursive; font-size: 1rem; letter-spacing: 1px;
    padding: 3px 14px; border-radius: 20px; margin-top: 6px;
  }

  /* ── HISTORY BUTTON – nur Setup-Screen ── */
  .btn-history {
    position: fixed; top: 14px; left: 14px; z-index: 200;
    background: rgba(245,197,66,0.15); border: 2px solid var(--gold);
    border-radius: 12px; padding: 7px 13px; color: var(--gold);
    font-family: 'Bangers', cursive; font-size: 1rem; letter-spacing: 1px;
    cursor: pointer; display: none; align-items: center; gap: 6px;
    transition: background 0.2s, transform 0.15s; backdrop-filter: blur(6px);
  }
  .btn-history:hover { background: rgba(245,197,66,0.28); transform: scale(1.04); }
  .btn-history .hist-count {
    background: var(--gold); color: var(--blue); border-radius: 50%;
    width: 20px; height: 20px; font-size: 0.75rem;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Nunito', sans-serif; font-weight: 800;
  }

  /* ── BACK BUTTON ── */
  .btn-back {
    position: fixed; top: 14px; left: 14px; z-index: 200;
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
    border-radius: 12px; padding: 7px 13px; color: white;
    font-family: 'Bangers', cursive; font-size: 1rem; letter-spacing: 1px;
    cursor: pointer; display: none; align-items: center; gap: 6px;
    transition: background 0.2s, transform 0.15s; backdrop-filter: blur(6px);
  }
  .btn-back:hover { background: rgba(255,255,255,0.2); transform: scale(1.04); }

  /* ── HISTORY SCREEN ── */
  #history-screen { display: none; padding: 12px; max-width: 600px; margin: 0 auto; }
  .history-title {
    font-family: 'Bangers', cursive; font-size: 2rem; color: var(--gold);
    letter-spacing: 3px; text-align: center; margin-bottom: 16px; margin-top: 8px;
  }
  .no-history { text-align: center; color: #aac4f0; font-size: 1rem; margin-top: 40px; opacity: 0.7; }

  .history-entry {
    background: rgba(255,255,255,0.07); border: 2px solid rgba(245,197,66,0.2);
    border-radius: 16px; margin-bottom: 10px; overflow: hidden;
    transition: border-color 0.2s; cursor: pointer;
  }
  .history-entry:hover { border-color: rgba(245,197,66,0.5); }
  .history-entry.open { border-color: var(--gold); }

  .history-mini { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
  .history-mini-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .history-game-num { font-family: 'Bangers', cursive; font-size: 0.85rem; color: #aac4f0; letter-spacing: 1px; white-space: nowrap; }
  .history-winner-pill { background: linear-gradient(135deg, var(--gold), var(--orange)); color: var(--blue); font-weight: 800; font-size: 0.85rem; padding: 3px 12px; border-radius: 20px; }
  .history-chevron { font-size: 0.85rem; color: #aac4f0; transition: transform 0.25s; flex-shrink: 0; margin-left: 8px; }
  .history-entry.open .history-chevron { transform: rotate(180deg); }

  .history-detail { display: none; padding: 0 16px 14px; border-top: 1px solid rgba(255,255,255,0.08); animation: fadeIn 0.2s ease; }
  .history-entry.open .history-detail { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  .detail-meta { font-size: 0.8rem; color: #aac4f0; margin: 10px 0 8px; letter-spacing: 1px; text-transform: uppercase; }
  .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .detail-row:last-child { border-bottom: none; }
  .detail-rank { font-family: 'Bangers', cursive; font-size: 0.9rem; background: rgba(255,255,255,0.12); color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .detail-rank.gold { background: var(--gold); color: var(--blue); }
  .detail-name { font-weight: 800; flex: 1; margin-left: 10px; }
  .detail-score { font-family: 'Bangers', cursive; font-size: 1.2rem; color: var(--gold); }
  .detail-rounds { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; margin-left: 34px; }
  .detail-chip { font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 20px; background: rgba(255,255,255,0.1); color: #cce0ff; }
  .detail-chip.bust { background: rgba(231,76,60,0.2); color: #ff8a80; }
  .detail-chip.flip7 { background: rgba(245,197,66,0.2); color: var(--gold); }

  /* ── SETUP ── */
  #setup-screen { max-width: 480px; margin: 0 auto; padding: 16px; }
  .setup-card { background: rgba(255,255,255,0.07); border: 2px solid rgba(245,197,66,0.3); border-radius: 20px; padding: 24px; backdrop-filter: blur(8px); }
  .setup-card h2 { font-family: 'Bangers', cursive; font-size: 1.6rem; letter-spacing: 2px; color: var(--gold); margin-bottom: 16px; text-align: center; }
  .player-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .player-input-row input { flex: 1; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 10px 14px; color: white; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 700; outline: none; transition: border-color 0.2s; }
  .player-input-row input:focus { border-color: var(--gold); }
  .player-input-row input::placeholder { color: rgba(255,255,255,0.35); }
  .btn-remove { background: rgba(231,76,60,0.3); border: 2px solid var(--red); color: var(--red); border-radius: 10px; width: 42px; font-size: 1.2rem; cursor: pointer; transition: background 0.2s; }
  .btn-remove:hover { background: var(--red); color: white; }
  .btn-add { width: 100%; background: rgba(245,197,66,0.15); border: 2px dashed var(--gold); color: var(--gold); border-radius: 12px; padding: 10px; font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 4px; transition: background 0.2s; }
  .btn-add:hover { background: rgba(245,197,66,0.25); }
  .btn-start { width: 100%; background: linear-gradient(135deg, var(--gold), var(--orange)); border: none; border-radius: 14px; padding: 14px; font-family: 'Bangers', cursive; font-size: 1.5rem; letter-spacing: 2px; color: var(--blue); cursor: pointer; margin-top: 20px; box-shadow: 0 4px 20px rgba(245,197,66,0.4); transition: transform 0.15s, box-shadow 0.15s; }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(245,197,66,0.5); }

  /* ── GAME ── */
  #game-screen { display: none; padding: 12px; max-width: 600px; margin: 0 auto; }
  .round-info { text-align: center; margin-bottom: 16px; }
  .round-badge { font-family: 'Bangers', cursive; font-size: 1.4rem; letter-spacing: 2px; background: var(--blue-light); border: 2px solid var(--gold); border-radius: 30px; padding: 4px 20px; color: var(--gold); display: inline-block; }
  .players-grid { display: grid; gap: 12px; margin-bottom: 16px; }
  .player-card { background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 18px; padding: 14px 16px; transition: border-color 0.2s, background 0.2s; position: relative; overflow: hidden; }
  .player-card.winner-glow { border-color: var(--gold); background: rgba(245,197,66,0.1); }
  .player-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), var(--orange)); opacity: 0; transition: opacity 0.3s; }
  .player-card.winner-glow::before { opacity: 1; }
  .player-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .player-name { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .rank-badge { font-family: 'Bangers', cursive; font-size: 0.9rem; background: var(--gold); color: var(--blue); border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .total-score { font-family: 'Bangers', cursive; font-size: 2rem; color: var(--gold); letter-spacing: 1px; line-height: 1; }
  .score-label { font-size: 0.7rem; color: #aac4f0; text-transform: uppercase; letter-spacing: 1px; }
  .input-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .round-input { flex: 1; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 8px 12px; color: white; font-family: 'Nunito', sans-serif; font-size: 1.1rem; font-weight: 700; outline: none; text-align: center; transition: border-color 0.2s; width: 80px; }
  .round-input:focus { border-color: var(--gold); }
  .flip7-btn { background: rgba(245,197,66,0.15); border: 2px solid var(--gold); border-radius: 8px; padding: 7px 10px; font-size: 0.7rem; font-weight: 800; color: var(--gold); cursor: pointer; white-space: nowrap; transition: transform 0.1s, background 0.15s, box-shadow 0.15s; letter-spacing: 0.5px; }
  .flip7-btn:hover { transform: scale(1.05); }
  .flip7-btn.flip7-active { background: linear-gradient(135deg, #f5c542, #f07d2a); color: var(--blue); border-color: transparent; box-shadow: 0 0 12px rgba(245,197,66,0.6); }

  /* ── BUST TOGGLE ── */
  .bust-btn { background: rgba(231,76,60,0.15); border: 2px solid var(--red); border-radius: 8px; padding: 7px 10px; font-size: 0.7rem; font-weight: 800; color: var(--red); cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s, box-shadow 0.15s; letter-spacing: 0.5px; }
  .bust-btn.bust-active { background: var(--red); color: white; box-shadow: 0 0 12px rgba(231,76,60,0.6); }

  .history-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .history-chip { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: rgba(255,255,255,0.1); color: #cce0ff; }
  .history-chip.bust { background: rgba(231,76,60,0.2); color: #ff8a80; }
  .history-chip.flip7 { background: rgba(245,197,66,0.2); color: var(--gold); }

  .progress-bar-wrap { background: rgba(255,255,255,0.08); border-radius: 6px; height: 6px; margin-top: 10px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold), var(--orange)); transition: width 0.5s ease; max-width: 100%; }

  .action-bar { display: flex; gap: 10px; margin-bottom: 16px; }
  .btn-confirm { flex: 1; background: linear-gradient(135deg, var(--green), #27ae60); border: none; border-radius: 14px; padding: 13px; font-family: 'Bangers', cursive; font-size: 1.3rem; letter-spacing: 2px; color: white; cursor: pointer; box-shadow: 0 3px 15px rgba(46,204,113,0.35); transition: transform 0.15s; }
  .btn-confirm:hover { transform: translateY(-2px); }
  .btn-reset { background: rgba(231,76,60,0.2); border: 2px solid var(--red); border-radius: 14px; padding: 13px 18px; font-family: 'Bangers', cursive; font-size: 1rem; letter-spacing: 1px; color: var(--red); cursor: pointer; transition: background 0.15s; }
  .btn-reset:hover { background: var(--red); color: white; }

  /* ── WINNER ── */
  #winner-screen { display: none; text-align: center; padding: 32px 16px; max-width: 480px; margin: 0 auto; }
  .trophy { font-size: 5rem; margin-bottom: 8px; animation: bounce 1s infinite alternate; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
  .winner-name { font-family: 'Bangers', cursive; font-size: 3rem; color: var(--gold); letter-spacing: 3px; text-shadow: 3px 3px 0 var(--orange); }
  .final-scores { background: rgba(255,255,255,0.07); border: 2px solid rgba(245,197,66,0.3); border-radius: 20px; padding: 20px; margin: 20px 0; }
  .final-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .final-row:last-child { border-bottom: none; }
  .btn-new-game { background: linear-gradient(135deg, var(--gold), var(--orange)); border: none; border-radius: 14px; padding: 14px 40px; font-family: 'Bangers', cursive; font-size: 1.5rem; letter-spacing: 2px; color: var(--blue); cursor: pointer; box-shadow: 0 4px 20px rgba(245,197,66,0.4); }

  .notification { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px); background: var(--gold); color: var(--blue); font-family: 'Bangers', cursive; font-size: 1.2rem; letter-spacing: 2px; padding: 10px 28px; border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: transform 0.3s ease; z-index: 999; white-space: nowrap; }
  .notification.show { transform: translateX(-50%) translateY(0); }

  @media (min-width: 480px) { .players-grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<button class="btn-history" id="btn-history" onclick="showHistory()">
  📋 Verlauf <span class="hist-count" id="hist-count">0</span>
</button>

<button class="btn-back" id="btn-back" onclick="hideHistory()">
  ← Zurück
</button>

<header>
  <h1>FLIP 7</h1>
  <p>Punktezähler</p>
  <div class="target-badge">🎯 Ziel: 200 Punkte</div>
</header>

<div class="notification" id="notification"></div>

<div id="setup-screen">
  <div class="setup-card">
    <h2>👥 Spieler eingeben</h2>
    <div id="player-inputs"></div>
    <button class="btn-add" onclick="addPlayerInput()">+ Spieler hinzufügen</button>
    <button class="btn-start" onclick="startGame()">🃏 SPIEL STARTEN</button>
  </div>
</div>

<div id="game-screen">
  <div class="round-info">
    <div class="round-badge">⚡ RUNDE <span id="round-number">1</span></div>
  </div>
  <div class="players-grid" id="players-grid"></div>
  <div class="action-bar">
    <button class="btn-confirm" onclick="confirmRound()">✓ RUNDE BESTÄTIGEN</button>
    <button class="btn-reset" onclick="confirmReset()">↺</button>
  </div>
</div>

<div id="winner-screen">
  <div class="trophy">🏆</div>
  <p style="color:#aac4f0;font-size:0.9rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px">Gewinner</p>
  <div class="winner-name" id="winner-name"></div>
  <div class="final-scores" id="final-scores"></div>
  <button class="btn-new-game" onclick="newGame()">🎮 NEUES SPIEL</button>
</div>

<div id="history-screen">
  <div class="history-title">📋 VERLAUF</div>
  <div id="history-list"></div>
</div>

<script>
  const TARGET = 200;
  let players = [];
  let round = 1;

  // ── Verlauf aus localStorage laden ──
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem('flip7_history') || '[]'); }
    catch(e) { return []; }
  }
  function saveHistory(h) {
    localStorage.setItem('flip7_history', JSON.stringify(h));
  }

  let gameHistory = loadHistory();

  // ── Screen-Verwaltung ──
  function setScreen(name) {
    document.getElementById('setup-screen').style.display   = name === 'setup'   ? '' : 'none';
    document.getElementById('game-screen').style.display    = name === 'game'    ? 'block' : 'none';
    document.getElementById('winner-screen').style.display  = name === 'winner'  ? 'block' : 'none';
    document.getElementById('history-screen').style.display = name === 'history' ? '' : 'none';

    const btnH = document.getElementById('btn-history');
    const btnB = document.getElementById('btn-back');

    // Verlauf-Button NUR auf Setup-Screen, NUR wenn Spiele vorhanden
    btnH.style.display = (name === 'setup' && gameHistory.length > 0) ? 'flex' : 'none';
    btnB.style.display = name === 'history' ? 'flex' : 'none';
  }

  function refreshHistoryBtn() {
    document.getElementById('hist-count').textContent = gameHistory.length;
  }

  // ── Verlauf ──
  function showHistory() {
    renderHistory();
    setScreen('history');
  }

  function hideHistory() {
    setScreen('setup');
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    if (gameHistory.length === 0) {
      list.innerHTML = '<div class="no-history">Noch keine abgeschlossenen Spiele.</div>';
      return;
    }
    list.innerHTML = gameHistory.slice().reverse().map((game, revIdx) => {
      const idx = gameHistory.length - 1 - revIdx;
      const sorted = [...game.players].sort((a,b) => b.total - a.total);
      const winner = sorted[0];
      const detailRows = sorted.map((p, pi) => {
        const chips = p.history.map(h => {
          let cls = h.type === 'bust' ? 'bust' : h.type === 'flip7' ? 'flip7' : '';
          let label = h.type === 'bust' ? '💀 0' : h.type === 'flip7' ? `⚡+${h.val}` : `+${h.val}`;
          return `<span class="detail-chip ${cls}">${label}</span>`;
        }).join('');
        return `
          <div>
            <div class="detail-row">
              <div class="detail-rank ${pi===0?'gold':''}">${pi+1}</div>
              <div class="detail-name">${p.name}</div>
              <div class="detail-score">${p.total} Pkt.</div>
            </div>
            ${chips ? `<div class="detail-rounds">${chips}</div>` : ''}
          </div>`;
      }).join('');

      return `
        <div class="history-entry" id="hentry-${idx}" onclick="toggleEntry(${idx})">
          <div class="history-mini">
            <div class="history-mini-left">
              <span class="history-game-num">Spiel ${idx+1} · ${game.rounds} Runden</span>
              <span class="history-winner-pill">🏆 ${winner.name}</span>
            </div>
            <span class="history-chevron">▼</span>
          </div>
          <div class="history-detail">
            <div class="detail-meta">Scoreboard</div>
            ${detailRows}
          </div>
        </div>`;
    }).join('');
  }

  function toggleEntry(idx) {
    const el = document.getElementById(`hentry-${idx}`);
    if (el) el.classList.toggle('open');
  }

  // ── Setup ──
  function addPlayerInput(name = '') {
    const div = document.createElement('div');
    div.className = 'player-input-row';
    const idx = document.getElementById('player-inputs').children.length + 1;
    div.innerHTML = `
      <input type="text" placeholder="Spieler ${idx}" value="${name}" maxlength="20" />
      <button class="btn-remove" onclick="this.parentElement.remove()">✕</button>
    `;
    document.getElementById('player-inputs').appendChild(div);
  }

  addPlayerInput();
  addPlayerInput();

  function startGame() {
    const inputs = document.querySelectorAll('#player-inputs input');
    players = [];
    inputs.forEach(inp => {
      const n = inp.value.trim();
      if (n) players.push({ name: n, total: 0, history: [], busted: false });
    });
    if (players.length < 2) { showNotif('Mindestens 2 Spieler!'); return; }
    round = 1;
    setScreen('game');
    renderGame();
  }

  // ── Game ──
  function renderGame() {
    document.getElementById('round-number').textContent = round;
    const grid = document.getElementById('players-grid');
    grid.innerHTML = '';
    const ranked = [...players].sort((a,b) => b.total - a.total);

    players.forEach((p, i) => {
      const rank = ranked.findIndex(r => r === p) + 1;
      const pct = Math.min((p.total / TARGET) * 100, 100);
      const histHTML = p.history.map((h, ri) => {
        let cls = h.type === 'bust' ? 'bust' : h.type === 'flip7' ? 'flip7' : '';
        let label = h.type === 'bust' ? '💀 0' : h.type === 'flip7' ? `⚡+${h.val}` : `+${h.val}`;
        return `<span class="history-chip ${cls}" title="Runde ${ri+1}">${label}</span>`;
      }).join('');

      const card = document.createElement('div');
      card.className = 'player-card' + (p.total >= TARGET ? ' winner-glow' : '');
      card.innerHTML = `
        <div class="player-header">
          <div class="player-name">
            <div class="rank-badge">${rank}</div>
            ${p.name}
          </div>
          <div style="text-align:right">
            <div class="total-score">${p.total}</div>
            <div class="score-label">Punkte</div>
          </div>
        </div>
        <div class="input-row">
          <input class="round-input" id="input-${i}" type="number" min="0" placeholder="Pkt."
            ${p.busted ? 'disabled style="opacity:0.4"' : ''} />
          <button class="flip7-btn" id="flip7-btn-${i}" onclick="setFlip7(${i})" ${p.busted ? 'disabled style="opacity:0.4"' : ''}>⚡ FLIP 7</button>
          <button class="bust-btn ${p.busted ? 'bust-active' : ''}" onclick="toggleBust(${i})">💀 PLEITE</button>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" style="width:${pct}%"></div>
        </div>
        ${histHTML ? `<div class="history-row">${histHTML}</div>` : ''}
      `;
      grid.appendChild(card);
    });
  }

  function setFlip7(i) {
    if (players[i].busted) return;
    const inp = document.getElementById(`input-${i}`);
    const btn = document.getElementById(`flip7-btn-${i}`);
    if (inp.dataset.flip7 === '1') {
      delete inp.dataset.flip7;
      inp.value = '';
      if (btn) btn.classList.remove('flip7-active');
    } else {
      inp.dataset.flip7 = '1';
      inp.value = 'FLIP 7';
      if (btn) btn.classList.add('flip7-active');
    }
  }

  function toggleBust(i) {
    // Werte aller Inputs vor dem Re-Render sichern
    const savedInputs = players.map((_, idx) => {
      const el = document.getElementById(`input-${idx}`);
      return el ? { value: el.value, flip7: el.dataset.flip7 } : { value: '', flip7: undefined };
    });

    players[i].busted = !players[i].busted;
    if (players[i].busted) { savedInputs[i].value = ''; delete savedInputs[i].flip7; }

    renderGame();

    // Werte nach dem Re-Render wiederherstellen
    players.forEach((_, idx) => {
      if (idx === i) return; // Bust-Spieler bleibt leer
      const el = document.getElementById(`input-${idx}`);
      const btn = document.getElementById(`flip7-btn-${idx}`);
      if (!el) return;
      el.value = savedInputs[idx].value;
      if (savedInputs[idx].flip7) {
        el.dataset.flip7 = savedInputs[idx].flip7;
        if (btn) btn.classList.add('flip7-active');
      }
    });
  }

  function confirmRound() {
    let anyFilled = false;
    let winner = null;

    players.forEach((p, i) => {
      const inp = document.getElementById(`input-${i}`);
      const isBust = p.busted;
      const isFlip7 = inp && (inp.dataset.flip7 === '1' || inp.value.toUpperCase() === 'FLIP7');
      const rawVal = inp ? (parseInt(inp.value) || 0) : 0;

      if (isBust) {
        p.history.push({ type: 'bust', val: 0 });
        anyFilled = true;
        p.busted = false;
      } else if (isFlip7) {
        p.total += 15;
        p.history.push({ type: 'flip7', val: 15 });
        anyFilled = true;
        if (inp) delete inp.dataset.flip7;
      } else if (inp && inp.value !== '') {
        p.total += rawVal;
        p.history.push({ type: 'normal', val: rawVal });
        anyFilled = true;
      }

      if (p.total >= TARGET && !winner) winner = p;
    });

    if (!anyFilled) { showNotif('Bitte Punkte eingeben!'); return; }
    round++;

    if (winner) {
      // In Verlauf speichern
      gameHistory.push({
        players: players.map(p => ({ name: p.name, total: p.total, history: [...p.history] })),
        rounds: round - 1
      });
      saveHistory(gameHistory);
      showWinner();
    } else {
      renderGame();
    }
  }

  function showWinner() {
    const sorted = [...players].sort((a,b) => b.total - a.total);
    setScreen('winner');
    document.getElementById('winner-name').textContent = sorted[0].name;
    const fs = document.getElementById('final-scores');
    fs.innerHTML = sorted.map((p, i) => `
      <div class="final-row">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="rank-badge">${i+1}</div>
          <span style="font-weight:800">${p.name}</span>
        </div>
        <span style="font-family:'Bangers',cursive;font-size:1.4rem;color:${i===0?'var(--gold)':'white'}">${p.total} Pkt.</span>
      </div>
    `).join('');
  }

  function confirmReset() {
    if (confirm('Spiel wirklich neu starten?')) newGame();
  }

  function newGame() {
    players = [];
    round = 1;
    setScreen('setup');
    document.getElementById('player-inputs').innerHTML = '';
    addPlayerInput();
    addPlayerInput();
  }

  function showNotif(msg) {
    const n = document.getElementById('notification');
    n.textContent = msg;
    n.classList.add('show');
    setTimeout(() => n.classList.remove('show'), 2200);
  }

  // Init
  refreshHistoryBtn();
  setScreen('setup');
</script>
</body>
</html>
